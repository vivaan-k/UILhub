<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIL Math HQ</title>
    
    <!-- React & Babel Engines to compile JSX directly in the browser -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>

    <style>
        body, html, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #EEF2EC;
            font-family: 'Inter', system-ui, sans-serif;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // Bind the React hooks locally so your code can use them natively
        const { useState, useEffect, useMemo, useRef } = React;

        // Custom local SVG Icon placeholders to satisfy lucide-react variables
        const IconFallback = () => (
            <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: '1.2em', height: '1.2em' }}>⚙️</span>
        );
        const Calculator = IconFallback, CalendarDays = IconFallback, MessageCircleQuestion = IconFallback, 
              BookOpenText = IconFallback, LayoutDashboard = IconFallback, Plus = IconFallback, Clock = IconFallback, 
              MapPin = IconFallback, ExternalLink = IconFallback, CheckCircle2 = IconFallback, Circle = IconFallback, 
              Trash2 = IconFallback, Search = IconFallback, MessagesSquare = IconFallback, Send = IconFallback, 
              CalendarClock = IconFallback, Pencil = IconFallback, X = IconFallback, Cpu = IconFallback, 
              Copy = IconFallback, Check = IconFallback;

        // =========================================================================
        // YOUR UNCHANGED APPLICATION CODE
        // =========================================================================
        const TOKENS = {
          bg: "#EEF2EC",
          grid: "#DCE4D8",
          ink: "#1F2E28",
          muted: "#66766D",
          primary: "#2F5D50",
          primaryDark: "#1F433A",
          accent: "#E1A33D",
          flag: "#C1443C",
          paper: "#FFFFFF",
        };

        const DISPLAY_FONT = "'JetBrains Mono', 'Courier New', monospace";
        const BODY_FONT = "'Source Serif 4', Georgia, serif";
        const UI_FONT = "'Inter', system-ui, sans-serif";

        const K = {
          solutions: "solutions-list",
          meets: "meets-list",
          questions: "questions-list",
          concepts: "concepts-list",
          chat: "chat-messages",
          schedule: "schedule-weeks",
          scheduleSettings: "schedule-settings",
          programs: "programs-list",
        };

        const DEFAULT_CURRICULUM = [
          { category: "Basic Math", concept: "Number Properties, Percents & Unit Conversions", blurb: "Real number properties, percent change, ratios, and rate problems — the 'basic math' section." },
          { category: "Algebra I", concept: "Linear Equations & Inequalities", blurb: "Solving and graphing lines, slope, and systems represented graphically." },
          { category: "Algebra I", concept: "Systems of Linear Equations", blurb: "Substitution, elimination, and word problems that reduce to 2+ equations." },
          { category: "Algebra I", concept: "Exponents & Radicals", blurb: "Exponent rules, simplifying radicals, and rational exponents." },
          { category: "Algebra I", concept: "Factoring & Quadratic Equations", blurb: "Factoring techniques, the quadratic formula, and the discriminant." },
          { category: "Geometry", concept: "Triangles, Similarity & the Pythagorean Theorem", blurb: "Triangle inequality, similarity ratios, and right-triangle relationships." },
          { category: "Geometry", concept: "Special Right Triangles & Right-Triangle Trig", blurb: "30-60-90 / 45-45-90 shortcuts and SOH-CAH-TOA applications." },
          { category: "Geometry", concept: "Circles: Angles, Arcs & Sectors", blurb: "Central/inscribed angles, arc length, and sector area formulas." },
          { category: "Geometry", concept: "Area, Surface Area & Volume", blurb: "2D/3D formulas for polygons, prisms, cylinders, cones, and spheres." },
          { category: "Geometry", concept: "Coordinate Geometry", blurb: "Distance/midpoint formulas, slope relationships, and equations of lines and circles." },
          { category: "Algebra II", concept: "Functions, Domain & Composition", blurb: "Domain/range, composition, inverses, and piecewise functions." },
          { category: "Algebra II", concept: "Arithmetic & Geometric Sequences/Series", blurb: "Explicit and recursive formulas, sums of finite and infinite series." },
          { category: "Algebra II", concept: "Logarithms & Exponential Functions", blurb: "Log rules, solving exponential equations, and growth/decay models." },
          { category: "Algebra II", concept: "Complex Numbers", blurb: "i-powers, operations with complex numbers, and the complex plane." },
          { category: "Algebra II", concept: "Matrices & Determinants", blurb: "Matrix operations, determinants, and using matrices to solve systems." },
          { category: "Trigonometry", concept: "The Unit Circle & Trig Functions", blurb: "Radians, reference angles, and evaluating trig functions around the unit circle." },
          { category: "Trigonometry", concept: "Trig Identities & Equations", blurb: "Pythagorean/sum-difference identities and solving trig equations." },
          { category: "Trigonometry", concept: "Law of Sines & Law of Cosines", blurb: "Solving non-right triangles, including the ambiguous case." },
          { category: "Analytic Geometry", concept: "Conic Sections", blurb: "Standard forms and key features of circles, parabolas, ellipses, and hyperbolas." },
          { category: "Math Analysis", concept: "Polynomial & Rational Functions", blurb: "End behavior, zeros, asymptotes, and graphing rational functions." },
          { category: "Probability", concept: "Counting Principles, Permutations & Combinations", blurb: "The counting principle, nPr vs nCr, and arrangements with repetition." },
          { category: "Probability", concept: "Probability Rules & Number Theory", blurb: "Independent/dependent/conditional probability alongside primes, GCF/LCM, and divisibility." },
          { category: "Statistics", concept: "Measures of Center & Spread", blurb: "Mean, median, mode, range, and standard deviation, plus how outliers shift them." },
          { category: "Basic Calculus", concept: "Limits & Introduction to Derivatives", blurb: "Evaluating limits and basic differentiation rules — the final stretch of the test." },
        ];

        function nextMonday() {
          const d = new Date();
          const day = d.getDay();
          const add = day === 1 ? 0 : (8 - day) % 7 || 7;
          d.setDate(d.getDate() + (day === 1 ? 0 : add));
          d.setHours(0, 0, 0, 0);
          return d.toISOString().slice(0, 10);
        }
        function addDays(dateStr, n) {
          const d = new Date(dateStr + "T00:00:00");
          d.setDate(d.getDate() + n);
          return d.toISOString().slice(0, 10);
        }

        async function loadList(key) {
          try {
            const res = localStorage.getItem(key);
            return res ? JSON.parse(res) : [];
          } catch { return []; }
        }
        async function saveList(key, list) {
          try { localStorage.setItem(key, JSON.stringify(list)); } 
          catch (e) { console.error("storage save failed", e); }
        }
        function uid() {
          return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }
        function daysUntil(dateStr) {
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const target = new Date(dateStr + "T00:00:00");
          return Math.round((target - today) / 86400000);
        }
        function fmtDate(dateStr) {
          if (!dateStr) return "";
          const d = new Date(dateStr + "T00:00:00");
          return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
        }

        function GridBG() {
          return (
            <div style={{
                position: "absolute",
                inset: 0,
                backgroundImage: `linear-gradient(${TOKENS.grid} 1px, transparent 1px), linear-gradient(90deg, ${TOKENS.grid} 1px, transparent 1px)`,
                backgroundSize: "28px 28px",
                opacity: 0.6,
                pointerEvents: "none",
            }}/>
          );
        }

        function Field({ label, children }) {
          return (
            <label style={{ display: "block", marginBottom: 12 }}>
              <span style={{ fontFamily: UI_FONT, fontSize: 11, fontWeight: 600, letterSpacing: "0.06em", textTransform: "uppercase", color: TOKENS.muted, display: "block", marginBottom: 4 }}>
                {label}
              </span>
              {children}
            </label>
          );
        }

        const inputStyle = {
          width: "100%",
          boxSizing: "border-box",
          padding: "8px 10px",
          border: `1px solid ${TOKENS.grid}`,
          borderRadius: 6,
          fontFamily: UI_FONT,
          fontSize: 14,
          color: TOKENS.ink,
          background: "#FBFCFA",
        };

        function Button({ children, onClick, variant = "primary", type = "button", style = {} }) {
          const bg = variant === "primary" ? TOKENS.primary : variant === "danger" ? TOKENS.flag : "transparent";
          const color = variant === "ghost" ? TOKENS.primary : "#fff";
          return (
            <button type={type} onClick={onClick} style={{
        display: "inline-flex",
        alignItems: "center",
        gap: 6,
        padding: "8px 14px",
        borderRadius: 6,
        border: variant === "ghost" ? `1px solid ${TOKENS.primary}` : "none",
        background: bg,
        color: color,
        fontFamily: UI_FONT,
        fontSize: 13,
        fontWeight: 600,
        cursor: "pointer",
        ...style,
      }}
    >
      {children}
    </button>
  );
}

function Card({ children, style = {} }) {
  return (
    <div
      style={{
        padding: "20px",
        background: TOKENS.paper,
        borderRadius: "8px",
        border: `1px solid ${TOKENS.grid}`,
        marginBottom: "15px",
        ...style,
      }}
    >
      {children}
    </div>
  );
}

function Empty({ text }) {
  return (
    <div
      style={{
        padding: "40px",
        textAlign: "center",
        color: TOKENS.muted,
        fontSize: "14px",
        border: `2px dashed ${TOKENS.grid}`,
        borderRadius: "8px",
      }}
    >
      {text}
    </div>
  );
}

export default function UILMathHQ() {
  const [tab, setTab] = useState("dashboard");
  const [loading, setLoading] = useState(true);
  const [solutions, setSolutions] = useState([]);
  const [meets, setMeets] = useState([]);
  const [questions, setQuestions] = useState([]);
  const [concepts, setConcepts] = useState([]);
  const [chat, setChat] = useState([]);
  const [schedule, setSchedule] = useState([]);
  const [scheduleSettings, setScheduleSettings] = useState({ startDate: nextMonday() });
  const [programs, setPrograms] = useState([]);

  useEffect(() => {
    (async () => {
      const [s, m, q, c, ch, sched, schedSettingsRes, progs] = await Promise.all([
        loadList(K.solutions),
        loadList(K.meets),
        loadList(K.questions),
        loadList(K.concepts),
        loadList(K.chat),
        loadList(K.schedule),
        (async () => {
          try {
            const r = await window.storage.get(K.scheduleSettings, true);
            return r && r.value ? JSON.parse(r.value) : null;
          } catch {
            return null;
          }
        })(),
        loadList(K.programs),
      ]);
      setSolutions(s);
      setMeets(m);
      setQuestions(q);
      setConcepts(c);
      setChat(ch);
      setPrograms(progs);
      let settings = schedSettingsRes;
      if (!settings) {
        settings = { startDate: nextMonday() };
        await window.storage.set(K.scheduleSettings, JSON.stringify(settings), true);
      }
      setScheduleSettings(settings);
      setLoading(false);
    })();
  }, []);

  return (
    <div style={{ position: "relative", minHeight: "100vh", padding: "30px", boxSizing: "border-box" }}>
      <GridBG />
      <div style={{ position: "relative", maxWidth: "1000px", margin: "0 auto" }}>
        
        {/* Header Section */}
        <header style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `2px solid ${TOKENS.ink}`, paddingBottom: "15px", marginBottom: "30px" }}>
          <div>
            <h1 style={{ fontFamily: DISPLAY_FONT, color: TOKENS.ink, margin: 0, fontSize: "28px" }}>⚡ UIL MATH HQ</h1>
            <p style={{ fontFamily: BODY_FONT, color: TOKENS.muted, margin: "5px 0 0 0" }}>High School Mathematics Contest Practice Center</p>
          </div>
          <div style={{ display: "flex", gap: "10px" }}>
            <Button onClick={() => setTab("dashboard")} variant={tab === "dashboard" ? "primary" : "ghost"}>Dashboard</Button>
            <Button onClick={() => setTab("curriculum")} variant={tab === "curriculum" ? "primary" : "ghost"}>Curriculum</Button>
          </div>
        </header>

        {/* Dashboard View */}
        {tab === "dashboard" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px" }}>
              <Card>
                <h3 style={{ fontFamily: DISPLAY_FONT, margin: "0 0 10px 0" }}>Quick Overview</h3>
                <p style={{ fontSize: "14px", color: TOKENS.ink }}>Track concept progression mapped to the general math, algebra, geometry, trigonometry, and calculus formulas required by the UIL Constitution.</p>
              </Card>
              <Card>
                <h3 style={{ fontFamily: DISPLAY_FONT, margin: "0 0 10px 0" }}>Contest Countdown</h3>
                <p style={{ fontSize: "24px", fontWeight: "bold", margin: "5px 0", color: TOKENS.flag }}>24 Weeks Left</p>
                <span style={{ fontSize: "12px", color: TOKENS.muted }}>Curriculum structured into 24 distinct learning stages.</span>
              </Card>
            </div>
          </div>
        )}

        {/* Curriculum View */}
        {tab === "curriculum" && (
          <div>
            <h2 style={{ fontFamily: DISPLAY_FONT, borderBottom: `1px solid ${TOKENS.grid}`, paddingBottom: "10px" }}>24-Week Structural Breakdown</h2>
            <div style={{ display: "flex", flexDirection: "column", gap: "12px", marginTop: "20px" }}>
              {DEFAULT_CURRICULUM.map((item, idx) => (
                <Card key={idx} style={{ borderLeft: `5px solid ${TOKENS.primary}` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                    <strong style={{ fontFamily: DISPLAY_FONT, color: TOKENS.primaryDark }}>Week {idx + 1}: {item.concept}</strong>
                    <span style={{ background: TOKENS.grid, padding: "2px 8px", borderRadius: "12px", fontSize: "11px", fontWeight: "bold" }}>{item.category}</span>
                  </div>
                  <p style={{ fontFamily: BODY_FONT, fontSize: "14px", margin: "8px 0 0 0", color: TOKENS.ink }}>{item.blurb}</p>
                </Card>
              ))}
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

// Final mounting engine for browser-ready rendering
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<UILMathHQ />);
</script>
</body>
</html>
